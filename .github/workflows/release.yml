name: Official V8 stable SDK release
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional completed trusted release run to recover; otherwise select automatically
        type: string
        required: false
        default: ""
      reuse_run_id:
        description: Compatibility alias for source_run_id (must agree if both are set)
        type: string
        required: false
        default: ""
      targets:
        description: Optional exact missing target set; does not force already completed SDK builds
        type: string
        required: false
        default: ""
      sdk_artifact_revision:
        description: Immutable SDK recipe revision; positive revisions require a fixed trusted source run
        type: string
        required: false
        default: "0"
      replaces_targets:
        description: For a positive revision, exactly macos-arm64,macos-x64; ordinary recovery leaves empty
        type: string
        required: false
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: official-v8-stable-release
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-26.04
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      version: ${{ steps.plan.outputs.version }}
      revision: ${{ steps.plan.outputs.revision }}
      tag: ${{ steps.plan.outputs.tag }}
      sdk_artifact_revision: ${{ steps.plan.outputs.sdk_artifact_revision }}
      replaces_targets: ${{ steps.plan.outputs.replaces_targets }}
      matrix: ${{ steps.matrix.outputs.value }}
      build_count: ${{ steps.matrix.outputs.build_count }}
      reuse_count: ${{ steps.matrix.outputs.reuse_count }}
      linux_sdk_reused: ${{ steps.matrix.outputs.linux_sdk_reused }}
      windows_sdk_reused: ${{ steps.matrix.outputs.windows_sdk_reused }}
      linux_runtime_required: ${{ steps.plan.outputs.linux_runtime_required }}
      windows_runtime_required: ${{ steps.plan.outputs.windows_runtime_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Detect official stable V8 source
        if: inputs.source_run_id == '' && inputs.reuse_run_id == '' && (inputs.sdk_artifact_revision == '' || inputs.sdk_artifact_revision == '0') && inputs.replaces_targets == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tool/detect_stable.py --repository "$GITHUB_REPOSITORY" --output detection.json
      - name: Resolve trusted immutable recovery graph
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id || '' }}
          REBUILD_TARGETS: ${{ inputs.targets || '' }}
          SDK_ARTIFACT_REVISION: ${{ inputs.sdk_artifact_revision || '0' }}
          REPLACES_TARGETS: ${{ inputs.replaces_targets || '' }}
        run: |
          if [[ -n "$SOURCE_RUN_ID" && -n "$REUSE_RUN_ID" && "$SOURCE_RUN_ID" != "$REUSE_RUN_ID" ]]; then
            echo 'source_run_id and reuse_run_id must agree' >&2; exit 1
          fi
          task_source_run="${SOURCE_RUN_ID:-$REUSE_RUN_ID}"
          if [[ ! "$SDK_ARTIFACT_REVISION" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo 'sdk_artifact_revision must be a canonical nonnegative integer' >&2; exit 1
          fi
          if [[ "$SDK_ARTIFACT_REVISION" != "0" && -z "$task_source_run" ]]; then
            echo 'SDK revisions require a fixed trusted source run' >&2; exit 1
          fi
          if [[ -n "$task_source_run" ]]; then
            python tool/release_resume.py plan --repository "$GITHUB_REPOSITORY" --source-run-id "$task_source_run" --sdk-artifact-revision "$SDK_ARTIFACT_REVISION" --replaces-targets "$REPLACES_TARGETS" --targets "$REBUILD_TARGETS" --builder-revision "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
          else
            python tool/release_resume.py auto --repository "$GITHUB_REPOSITORY" --detection detection.json --current-run-id "$GITHUB_RUN_ID" --sdk-artifact-revision "$SDK_ARTIFACT_REVISION" --replaces-targets "$REPLACES_TARGETS" --targets "$REBUILD_TARGETS" --builder-revision "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
          fi
      - name: Select only genuinely missing SDK targets
        id: matrix
        if: steps.plan.outputs.should_build == 'true'
        run: |
          python - <<'PYTHON'
          import json, os
          entries = [{'target': 'android-arm64', 'runner': 'ubuntu-26.04', 'jobs': 4, 'python_arch': 'x64'}, {'target': 'android-x64', 'runner': 'ubuntu-26.04', 'jobs': 4, 'python_arch': 'x64'}, {'target': 'ios-arm64', 'runner': 'macos-26', 'jobs': 2, 'python_arch': 'arm64'}, {'target': 'ios-simulator-arm64', 'runner': 'macos-26', 'jobs': 2, 'python_arch': 'arm64'}, {'target': 'macos-arm64', 'runner': 'macos-26', 'jobs': 2, 'python_arch': 'arm64'}, {'target': 'macos-x64', 'runner': 'macos-26-intel', 'jobs': 4, 'python_arch': 'x64'}, {'target': 'linux-x64', 'runner': 'ubuntu-26.04', 'jobs': 4, 'python_arch': 'x64'}, {'target': 'linux-arm64', 'runner': 'ubuntu-26.04', 'jobs': 4, 'python_arch': 'x64'}, {'target': 'windows-x64', 'runner': 'windows-2025', 'jobs': 4, 'python_arch': 'x64'}, {'target': 'windows-arm64', 'runner': 'windows-2025', 'jobs': 4, 'python_arch': 'x64'}]
          with open('reuse-plan.json') as task_plan_stream:
              plan = json.load(task_plan_stream)
          missing = set(plan['rebuildTargets'])
          if not missing.issubset({entry['target'] for entry in entries}):
              raise ValueError('Unknown missing target in verified plan')
          selected = [entry for entry in entries if entry['target'] in missing]
          sdk = plan['sdkAssets']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('value=' + json.dumps({'include': selected}, separators=(',', ':')) + '\n')
              stream.write('build_count=' + str(len(selected)) + '\n')
              stream.write('reuse_count=' + str(len(sdk)) + '\n')
              stream.write('linux_sdk_reused=' + str('linux-arm64' in sdk).lower() + '\n')
              stream.write('windows_sdk_reused=' + str('windows-arm64' in sdk).lower() + '\n')
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.should_build == 'true'
        with:
          archive: true
          name: stable-pins
          path: stable-pins.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.should_build == 'true'
        with:
          archive: true
          name: reuse-plan
          path: reuse-plan.json
          if-no-files-found: error
  reuse:
    needs: detect
    if: needs.detect.outputs.should_build == 'true' && needs.detect.outputs.reuse_count != '0'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reuse-plan
      - name: Download verified original SDK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tool/release_resume.py download --repository "$GITHUB_REPOSITORY" --output inputs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: reused-sdks
          path: inputs/
          if-no-files-found: error
          retention-days: 14
  build:
    needs: detect
    if: needs.detect.outputs.should_build == 'true' && needs.detect.outputs.build_count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.target == 'windows-arm64' && 360 || 240 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      DEPOT_TOOLS_UPDATE: '0'
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          name: stable-pins
      - name: Free unused Linux hosted image payloads
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h .
      - name: Select short Windows source cache path
        if: runner.os == 'Windows'
        run: echo 'V8_CACHE_ROOT=C:/v8cache' >> "$GITHUB_ENV"
      - name: Select source cache path
        if: runner.os != 'Windows'
        run: echo "V8_CACHE_ROOT=$GITHUB_WORKSPACE/.cache/v8-source" >> "$GITHUB_ENV"
      - name: Install the official Windows SDK required by the pinned toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkVersion = '10.0.28000.0'
          $sdkArch = if ('${{ matrix.target }}' -eq 'windows-arm64') { 'arm64' } else { 'x64' }
          function Get-RequiredWindowsSdk {
            $roots = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -ErrorAction SilentlyContinue
            if ($null -eq $roots -or [string]::IsNullOrWhiteSpace($roots.KitsRoot10)) { return $null }
            $kits = $roots.KitsRoot10
            $required = @(
              "Include\$sdkVersion\um\Windows.h",
              "Include\$sdkVersion\shared\sdkddkver.h",
              "Include\$sdkVersion\ucrt\stdlib.h",
              "Lib\$sdkVersion\um\$sdkArch\kernel32.lib",
              "Lib\$sdkVersion\ucrt\$sdkArch\libucrt.lib"
            )
            foreach ($relative in $required) {
              if (-not (Test-Path (Join-Path $kits $relative) -PathType Leaf)) { return $null }
            }
            return $kits
          }
          $kits = Get-RequiredWindowsSdk
          if ($null -eq $kits) {
            # Microsoft's September 2026 servicing installer for SDK 28000.
            # https://learn.microsoft.com/windows/apps/windows-sdk/downloads
            $url = 'https://download.microsoft.com/download/e6cfffdc-0d3e-4c6c-96d7-d491da459a07/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe'
            $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup-10.0.28000.2957.exe'
            Invoke-WebRequest -Uri $url -OutFile $installer
            $expected = 'E8E264ACA8BC34ABDF592352BF09F986A85CDB96DB0EFBA405CA9E149181FE61'
            if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Official Windows SDK installer hash differs' }
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw 'Official Windows SDK installer signature is not valid Microsoft code signing'
            }
            # /q is the silent switch recorded by Microsoft's WinGet SDK manifests.
            # Install the vendor defaults, then require the exact target headers/libs.
            $process = Start-Process -FilePath $installer -ArgumentList @('/q', '/norestart') -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "Windows SDK install failed: $($process.ExitCode)" }
            $kits = Get-RequiredWindowsSdk
          }
          if ($null -eq $kits) { throw "Required Windows SDK $sdkVersion headers and $sdkArch libraries are missing after installation" }
          "WINDOWSSDKDIR=$kits" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified Windows SDK $sdkVersion headers and $sdkArch libraries"
      - name: Fetch fixed official source and DEPS
        run: python tool/v8/build.py bootstrap --target '${{ matrix.target }}' --pins-file stable-pins.json --cache-root "$V8_CACHE_ROOT"
      - name: Install official Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          source_root=$(python -c 'import pathlib; print(next(pathlib.Path(".cache/v8-source").rglob("build/install-build-deps.sh")))')
          sudo "$source_root" --no-prompt
      - name: Build the native SDK
        run: python tool/v8/build.py build --target '${{ matrix.target }}' --pins-file stable-pins.json --cache-root "$V8_CACHE_ROOT" --output-root artifacts --jobs '${{ matrix.jobs }}'
      - name: Select the fixed official consumer compiler
        if: startsWith(matrix.target, 'macos-') || startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'windows-')
        run: |
          python - <<'PYTHON'
          import os, pathlib, subprocess, sys
          name = 'clang-cl.exe' if os.name == 'nt' else 'clang++'
          paths = list(pathlib.Path(os.environ['V8_CACHE_ROOT']).rglob('third_party/llvm-build/Release+Asserts/bin/' + name))
          if len(paths) != 1:
              raise ValueError('Exactly one fixed official Clang consumer compiler required')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('V8_SDK_COMPILER=' + str(paths[0].resolve()) + '\n')
              stream.write('V8_SDK_PROBE_SUFFIX=' + ('.exe' if os.name == 'nt' else '') + '\n')
              target = '${{ matrix.target }}'
              if target.startswith('linux-'):
                  arch = 'arm64' if target == 'linux-arm64' else 'amd64'
                  # Both Linux targets use build.py's fixed linux-x64 checkout.
                  source = pathlib.Path(os.environ['V8_CACHE_ROOT']) / '${{ needs.detect.outputs.revision }}' / 'linux-x64' / 'v8'
                  revision = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
                  if revision != '${{ needs.detect.outputs.revision }}' or not (source / 'include/v8-version.h').is_file():
                      raise ValueError('Fixed official Linux source identity differs')
                  compiler = source / ('third_party/llvm-build/Release+Asserts/bin/' + name)
                  if compiler.resolve() != paths[0].resolve():
                      raise ValueError('Consumer compiler differs from the fixed Linux checkout')
                  # Reassert the pinned installer's SHA-verified sysroot immediately
                  # before consumer linking, independently of the native build phase.
                  subprocess.run([sys.executable, str(source / 'build/linux/sysroot_scripts/install-sysroot.py'), '--arch=' + arch], check=True)
                  sysroot = source / ('build/linux/debian_bullseye_' + arch + '-sysroot')
                  print('Fixed Linux consumer source:', source.resolve())
                  print('Fixed Linux consumer compiler:', compiler.resolve())
                  print('Fixed Linux consumer sysroot:', sysroot.resolve())
                  if not sysroot.is_dir():
                      raise ValueError('Fixed official Chromium Linux sysroot missing')
                  stream.write('V8_SDK_SYSROOT=' + str(sysroot.resolve()) + '\n')
              elif target.startswith('macos-'):
                  sysroot = subprocess.check_output(['xcrun', '--sdk', 'macosx', '--show-sdk-path'], text=True).strip()
                  stream.write('V8_SDK_SYSROOT=' + sysroot + '\n')
          PYTHON
      - name: Cross-compile and link the ARM64 official V8 API consumer
        if: matrix.target == 'linux-arm64'
        run: python tool/sdk_smoke.py --sdk-root 'artifacts/${{ needs.detect.outputs.revision }}/linux-arm64' --expected-version '${{ needs.detect.outputs.version }}' --compiler "$V8_SDK_COMPILER" --sysroot "$V8_SDK_SYSROOT" --compile-only --probe-output smoke-probes/linux-arm64/sdk-probe --output smoke-probes/linux-arm64/sdk-probe.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: matrix.target == 'linux-arm64'
        with:
          archive: true
          name: smoke-probe-linux-arm64
          path: smoke-probes/linux-arm64/
          if-no-files-found: error
      - name: Cross-compile Windows ARM64 consumer on the x64 build host
        if: matrix.target == 'windows-arm64'
        run: python tool/sdk_smoke.py --sdk-root 'artifacts/${{ needs.detect.outputs.revision }}/windows-arm64' --expected-version '${{ needs.detect.outputs.version }}' --compiler "$V8_SDK_COMPILER" --compile-only --probe-output 'artifacts/${{ needs.detect.outputs.revision }}/windows-arm64/validation/sdk-probe.exe' --output 'artifacts/${{ needs.detect.outputs.revision }}/windows-arm64/validation/sdk-probe.exe.json'
      - name: Compile, link and execute an official V8 API SDK consumer
        if: startsWith(matrix.target, 'macos-') || matrix.target == 'linux-x64' || matrix.target == 'windows-x64'
        run: |
          task_sdk_sysroot_args=()
          if [[ -n "${V8_SDK_SYSROOT:-}" ]]; then task_sdk_sysroot_args=(--sysroot "$V8_SDK_SYSROOT"); fi
          python tool/sdk_smoke.py "${task_sdk_sysroot_args[@]}" --sdk-root 'artifacts/${{ needs.detect.outputs.revision }}/${{ matrix.target }}' --expected-version '${{ needs.detect.outputs.version }}' --compiler "$V8_SDK_COMPILER" --probe-output "artifacts/${{ needs.detect.outputs.revision }}/${{ matrix.target }}/validation/sdk-probe${V8_SDK_PROBE_SUFFIX:-}" --output 'artifacts/${{ needs.detect.outputs.revision }}/${{ matrix.target }}/sdk-smoke.json'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          archive: true
          name: v8-${{ matrix.target }}
          path: artifacts/${{ needs.detect.outputs.revision }}/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed SDK consumer diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          archive: true
          name: sdk-diagnostics-${{ matrix.target }}
          path: artifacts/${{ needs.detect.outputs.revision }}/
          if-no-files-found: ignore
          retention-days: 3
  linux-arm-runtime:
    needs: [detect, build, reuse]
    if: always() && needs.detect.outputs.should_build == 'true' && needs.detect.outputs.linux_runtime_required == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.reuse.result == 'success' || needs.reuse.result == 'skipped')
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reuse-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.detect.outputs.linux_sdk_reused != 'true'
        with:
          name: v8-linux-arm64
          path: artifacts/${{ needs.detect.outputs.revision }}
      - name: Prepare original immutable SDK and compiled consumer
        if: needs.detect.outputs.linux_sdk_reused == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tool/release_resume.py download --repository "$GITHUB_REPOSITORY" --only-target linux-arm64 --output reused-inputs
          mkdir -p 'artifacts/${{ needs.detect.outputs.revision }}'
          mv reused-inputs/v8-linux-arm64/linux-arm64 'artifacts/${{ needs.detect.outputs.revision }}/'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.detect.outputs.linux_sdk_reused != 'true'
        with:
          name: smoke-probe-linux-arm64
          path: artifacts/${{ needs.detect.outputs.revision }}/linux-arm64/validation
      - name: Retrieve authenticated original Linux consumer
        if: needs.detect.outputs.linux_sdk_reused == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tool/release_resume.py download --repository "$GITHUB_REPOSITORY" --probe-only --output old-probe
          mkdir -p 'artifacts/${{ needs.detect.outputs.revision }}/linux-arm64/validation'
          cp old-probe/sdk-probe* 'artifacts/${{ needs.detect.outputs.revision }}/linux-arm64/validation/'
      - name: Execute the already compiled official SDK consumer
        run: |
          chmod +x 'artifacts/${{ needs.detect.outputs.revision }}/linux-arm64/validation/sdk-probe'
          python tool/sdk_smoke.py --sdk-root 'artifacts/${{ needs.detect.outputs.revision }}/linux-arm64' --expected-version '${{ needs.detect.outputs.version }}' --execute-only --probe-path 'artifacts/${{ needs.detect.outputs.revision }}/linux-arm64/validation/sdk-probe' --output 'artifacts/${{ needs.detect.outputs.revision }}/linux-arm64/sdk-smoke.json'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: linux-arm-runtime
          path: |
            artifacts/${{ needs.detect.outputs.revision }}/linux-arm64/sdk-smoke.json
            artifacts/${{ needs.detect.outputs.revision }}/linux-arm64/validation/sdk-probe
            artifacts/${{ needs.detect.outputs.revision }}/linux-arm64/validation/sdk-probe.json
          if-no-files-found: error
  windows-arm-runtime:
    needs: [detect, build, reuse]
    if: always() && needs.detect.outputs.should_build == 'true' && needs.detect.outputs.windows_runtime_required == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.reuse.result == 'success' || needs.reuse.result == 'skipped')
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reuse-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.detect.outputs.windows_sdk_reused != 'true'
        with:
          name: v8-windows-arm64
          path: artifacts/${{ needs.detect.outputs.revision }}
      - name: Prepare original immutable SDK and compiled consumer
        if: needs.detect.outputs.windows_sdk_reused == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tool/release_resume.py download --repository "$GITHUB_REPOSITORY" --only-target windows-arm64 --output reused-inputs
          mkdir -p 'artifacts/${{ needs.detect.outputs.revision }}'
          mv reused-inputs/v8-windows-arm64/windows-arm64 'artifacts/${{ needs.detect.outputs.revision }}/'
      - name: Execute the already compiled official SDK consumer
        run: |
          python tool/sdk_smoke.py --sdk-root 'artifacts/${{ needs.detect.outputs.revision }}/windows-arm64' --expected-version '${{ needs.detect.outputs.version }}' --execute-only --probe-path 'artifacts/${{ needs.detect.outputs.revision }}/windows-arm64/validation/sdk-probe.exe' --output 'artifacts/${{ needs.detect.outputs.revision }}/windows-arm64/sdk-smoke.json'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: windows-arm-runtime
          path: |
            artifacts/${{ needs.detect.outputs.revision }}/windows-arm64/sdk-smoke.json
            artifacts/${{ needs.detect.outputs.revision }}/windows-arm64/validation/sdk-probe.exe
            artifacts/${{ needs.detect.outputs.revision }}/windows-arm64/validation/sdk-probe.exe.json
          if-no-files-found: error
  publish:
    needs: [detect, build, reuse, linux-arm-runtime, windows-arm-runtime]
    if: always() && needs.detect.outputs.should_build == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.reuse.result == 'success' || needs.reuse.result == 'skipped') && ((needs.detect.outputs.linux_runtime_required == 'true' && needs.linux-arm-runtime.result == 'success') || (needs.detect.outputs.linux_runtime_required == 'false' && needs.linux-arm-runtime.result == 'skipped')) && ((needs.detect.outputs.windows_runtime_required == 'true' && needs.windows-arm-runtime.result == 'success') || (needs.detect.outputs.windows_runtime_required == 'false' && needs.windows-arm-runtime.result == 'skipped'))
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.detect.outputs.build_count != '0'
        with:
          pattern: v8-*
          merge-multiple: false
          path: inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-pins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reuse-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.detect.outputs.reuse_count != '0'
        with:
          name: reused-sdks
          path: inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.detect.outputs.linux_runtime_required == 'true'
        with:
          name: linux-arm-runtime
          path: linux-runtime
      - name: Retrieve previously passed immutable linux runtime proof
        if: needs.detect.outputs.linux_runtime_required == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tool/release_resume.py download --repository "$GITHUB_REPOSITORY" --runtime-name linux-arm-runtime --output linux-runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.detect.outputs.windows_runtime_required == 'true'
        with:
          name: windows-arm-runtime
          path: windows-runtime
      - name: Retrieve previously passed immutable windows runtime proof
        if: needs.detect.outputs.windows_runtime_required == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tool/release_resume.py download --repository "$GITHUB_REPOSITORY" --runtime-name windows-arm-runtime --output windows-runtime
      - name: Assemble all ten SDKs with original producer revisions
        run: |
          for task_platform in linux windows; do
            task_target="$task_platform-arm64"
            mkdir -p "inputs/v8-$task_target/$task_target/validation"
            cp "$task_platform-runtime/sdk-smoke.json" "inputs/v8-$task_target/$task_target/sdk-smoke.json"
            cp "$task_platform-runtime/validation/"sdk-probe* "inputs/v8-$task_target/$task_target/validation/"
          done
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s tool -p 'test_*.py'
          python -m unittest discover -s tool/v8 -p 'test_*.py'
          python tool/release_package.py --reuse-plan reuse-plan.json --inputs inputs --pins-file stable-pins.json --output dist --builder-revision "$GITHUB_SHA"
      - name: Publish verified complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tool/release_publish.py --directory dist --repository "$GITHUB_REPOSITORY"
