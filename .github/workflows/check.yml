name: Release contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify stable detection contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify packager and publisher contracts
        run: python -m unittest discover -s tool -p 'test_*.py' -v
      - name: Verify official build and platform contracts
        run: python -m unittest discover -s tool/v8 -p 'test_*.py' -v
      - name: Compile Python entry points
        run: python -m compileall -q tool
